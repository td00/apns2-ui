<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Benachrichtigung senden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <h2 class="mb-4">Benachrichtigung senden</h2>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="severity" required>
                <option value=""> </option>
                <option value="info"> </option>
                <option value="warning">⚠️</option>
                <option value="urgent">❗️</option>
                <option value="danger">❌</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nachricht</label>
            <textarea class="form-control" name="notification" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Senden</button>
    </form>

    {% if result %}
        <div class="mt-4 alert {{ 'alert-success' if result.get('message') else 'alert-danger' }}">
            {{ result.get('message') or result.get('error') }}
        </div>
    {% endif %}
</div>
</body>
</html>
