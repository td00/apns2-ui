<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Benachrichtigung senden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <h2 class="mb-4">Benachrichtigung senden</h2>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Status (nur Apple)</label>
            <select class="form-select" name="severity" required>
                <option selected value="info"> </option>
                <option value="warning">⚠️</option>
                <option value="urgent">❗️</option>
                <option value="danger">❌</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Titel</label>
            <input type="text" class="form-control" name="notification_title" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nachricht</label>
            <textarea class="form-control" name="notification_text" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Plattform</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="platform" value="apple" id="apple" checked>
                <label class="form-check-label" for="apple">Apple</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="platform" value="android" id="android" checked>
                <label class="form-check-label" for="android">Android</label>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Senden</button>
    </form>

    {% if result %}
        <div class="mt-4">
            <h4>Antworten:</h4>
            {% for res in result.responses %}
                <div class="alert alert-info">
                    <strong>{{ res.platform }}:</strong>
                    <pre>{{ res.response | tojson(indent=2) }}</pre>
                </div>
            {% endfor %}
            {% if not result.responses %}
                <div class="alert alert-warning">Keine Plattform ausgewählt. Keine Nachricht gesendet.</div>
            {% endif %}
        </div>
    {% endif %}
</div>
</body>
</html>
